name: one-time-runtime-final-plot-hardening

on:
  push:
    branches:
      - refactor/runtime-final-plots-v2
    paths:
      - .github/workflows/one_time_runtime_final_plot_hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-final-plots-v2
          fetch-depth: 0

      - name: Apply hardening
        run: python .github/scripts/runtime_final_plot_hardening.py

      - name: Validate contracts
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('MINGO_ANALYSIS/MINGO_ANALYSIS_SCRIPTS/STAGES/STAGE_1/EVENT_DATA/STEP_1')
          scripts = {
              0: 'script_0_acq_to_raw.py', 1: 'script_1_raw_to_clean.py',
              2: 'script_2_clean_to_cal.py', 3: 'script_3_cal_to_list.py',
              4: 'script_4_list_to_fit.py', 5: 'script_5_fit_to_post.py',
          }
          for task, name in scripts.items():
              path = root / f'TASK_{task}/{name}'
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source, filename=str(path))
              if 'create_pdf = True' in source or 'create_pdf = save_plots' in source:
                  raise SystemExit(f'Task {task}: runtime PDF can still be enabled')
              for node in ast.walk(tree):
                  if isinstance(node, ast.If):
                      test = ast.get_source_segment(source, node.test) or ''
                      if 'create_pdf' in test and 'pdf' in ''.join(source.splitlines(True)[node.lineno-1:(node.end_lineno or node.lineno)]).lower():
                          raise SystemExit(f'Task {task}: runtime PDF branch remains at line {node.lineno}')
          task3 = (root / 'TASK_3/script_3_cal_to_list.py').read_text(encoding='utf-8')
          if "catalog[alias] = \"usual\"" in task3 and "missing_aliases" in task3:
              raise SystemExit('Task 3 still defaults missing runtime aliases to usual')
          PY
          python -m unittest MINGO_ANALYSIS.MINGO_ANALYSIS_SCRIPTS.common.tests.test_step1_runtime_final_plot_split
          git diff --check

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one_time_runtime_final_plot_hardening.yml
          git rm .github/scripts/runtime_final_plot_hardening.py
          git add MINGO_ANALYSIS/MINGO_ANALYSIS_SCRIPTS
          git commit -m "refactor(step1): enforce PNG-only runtime plotting"
          git push origin HEAD:refactor/runtime-final-plots-v2
