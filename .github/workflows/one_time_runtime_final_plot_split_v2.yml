name: one-time-runtime-final-plot-split-v2

on:
  push:
    branches:
      - refactor/runtime-final-plots-v2
    paths:
      - .github/workflows/one_time_runtime_final_plot_split_v2.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/runtime-final-plots-v2
          fetch-depth: 0

      - name: Apply split
        run: python .github/scripts/runtime_final_plot_split.py

      - name: Validate syntax and structure
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('MINGO_ANALYSIS/MINGO_ANALYSIS_SCRIPTS')
          paths = [root / 'common/final_plotting.py', root / 'common/step1_shared.py']
          for task, name in {
              0: 'script_0_acq_to_raw.py',
              1: 'script_1_raw_to_clean.py',
              2: 'script_2_clean_to_cal.py',
              3: 'script_3_cal_to_list.py',
              4: 'script_4_list_to_fit.py',
              5: 'script_5_fit_to_post.py',
          }.items():
              task_dir = root / f'STAGES/STAGE_1/EVENT_DATA/STEP_1/TASK_{task}'
              paths.extend([task_dir / name, task_dir / f'final_plots_task_{task}.py'])
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
          python -m unittest MINGO_ANALYSIS.MINGO_ANALYSIS_SCRIPTS.common.tests.test_step1_runtime_final_plot_split
          git diff --check

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one_time_runtime_final_plot_split_v2.yml
          git rm .github/scripts/runtime_final_plot_split.py
          git add MINGO_ANALYSIS/MINGO_ANALYSIS_SCRIPTS
          git commit -m "refactor(step1): split runtime and final plotting"
          git push origin HEAD:refactor/runtime-final-plots-v2
